apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mysql-vpa
  namespace: chat-app
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mysql-statefulset   # Matches your StatefulSet name
  updatePolicy:
    updateMode: "Auto"         # Options: "Off", "Initial", "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: mysql
      minAllowed:
        cpu: 250m
        memory: 512Mi
      maxAllowed:
        cpu: 2000m
        memory: 4Gi
