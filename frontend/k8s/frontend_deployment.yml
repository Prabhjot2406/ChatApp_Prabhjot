apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: chat-app
spec:
  replicas: 2
  selector:
    matchLabels:               
      app: frontend            
  template:
    metadata:
      labels:
        app: frontend          
    spec:
      containers:
      - name: frontend
        image: prabhjot24/chattingo-frontend-linux:latest
        ports:
        - containerPort: 80

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
